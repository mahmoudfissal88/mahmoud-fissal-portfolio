<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>(function(){var w=Math.min(screen.width||9999,screen.height||9999);if(w<700){document.documentElement.classList.add('ps');document.documentElement.style.setProperty('--ps',(768/w).toFixed(4));document.querySelector('meta[name=viewport]').setAttribute('content','width=768, initial-scale='+(w/768).toFixed(4)+', minimum-scale='+(w/768).toFixed(4)+', maximum-scale=5');}})();</script>
  <title>محمود فيصل | مصمم جرافيك ومطوّر تعليمي</title>
  <meta name="description" content="محمود فيصل — مصمم جرافيك ومطوّر محتوى تعليمي. شعارات، هويات بصرية، منصات تعليمية، ومحتوى مرئي.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css?v=1795610272">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%231f3ab0'/><text x='50' y='68' font-size='52' text-anchor='middle' fill='%23ffc61a' font-family='sans-serif' font-weight='900'>M</text></svg>">
  <script>
    (function(){var d=document.documentElement;d.classList.add("loading");
    try{var p=new URLSearchParams(location.search);d.setAttribute("data-theme",p.get("theme")||localStorage.getItem("mf-theme")||"light");}catch(e){}
    window.__mfReveal=function(){d.classList.remove("loading");};
    setTimeout(window.__mfReveal,12000);})();
  </script>
</head>
<body>

  <header class="site-header" id="siteHeader">
    <div class="container nav-wrap">
      <a href="#home" class="logo">
        <span class="logo-mark" id="logoMark">M</span>
        <span><span id="logoName">محمود فيصل</span><small id="logoRole">مصمم جرافيك ومطوّر تعليمي</small></span>
      </a>
      <nav class="main-nav" id="mainNav">
        <a href="#home" class="active" data-i18n="nav_home"></a>
        <a href="#services" data-i18n="nav_services"></a>
        <a href="#portfolio" data-i18n="nav_portfolio"></a>
        <a href="#designs" data-i18n="nav_designs" id="navDesigns" style="display:none"></a>
        <a href="#about" data-i18n="nav_about"></a>
        <a href="#contact" data-i18n="nav_contact"></a>
      </nav>
      <div class="nav-actions">
        <button class="icon-btn" id="themeToggle" title="Theme" aria-label="Toggle theme">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.3 11.3 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
        <button class="icon-btn lang-btn" id="langToggle" title="Language">EN</button>
        <a href="#contact" class="btn btn-primary nav-cta" data-i18n="nav_cta"></a>
        <button class="icon-btn burger" id="burger" aria-label="Menu">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main>
    <!-- Hero -->
    <section class="hero" id="home">
      <div class="container hero-grid">
        <div class="hero-text">
          <span class="hero-badge reveal"><span class="dot"></span><span data-i18n="hero_badge"></span></span>
          <h1 class="reveal" data-delay="1"><span id="heroLine1"></span><span class="line2" id="heroLine2"></span></h1>
          <p class="hero-sub reveal" data-delay="2" id="heroSub"></p>
          <div class="hero-ctas reveal" data-delay="3">
            <a href="#portfolio" class="btn btn-primary">
              <span data-i18n="hero_cta_work"></span>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
            </a>
            <a href="#contact" class="btn btn-ghost" data-i18n="hero_cta_contact"></a>
          </div>
          <div class="hero-stats reveal" data-delay="3" id="heroStats"></div>
        </div>
        <div class="hero-visual reveal" data-delay="1">
          <div class="blob-back"></div>
          <div class="blob-ring"></div>
          <div class="blob-photo"><img id="heroImg" src="assets/img/hero-designer.jpg" alt="Mahmoud Fissal"></div>
          <div class="float-icon f1"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/><path d="M2 2l7.6 7.6"/><circle cx="11" cy="11" r="2"/></svg></div>
          <div class="float-icon f2"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></div>
          <div class="float-icon f3"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg></div>
        </div>
      </div>
    </section>

    <!-- Marquee -->
    <div class="marquee"><div class="marquee-track" id="marqueeTrack"></div></div>

    <!-- Services -->
    <section id="services">
      <div class="container">
        <div class="sec-head reveal">
          <span class="kicker" data-i18n="services_kicker"></span>
          <h2 class="one-line" data-i18n="services_title"></h2>
          <p data-i18n="services_sub"></p>
        </div>
        <div class="svc-bleed"><div class="services-grid" id="servicesGrid"></div></div>
      </div>
    </section>

    <!-- Portfolio -->
    <section id="portfolio">
      <div class="container">
        <div class="sec-head reveal">
          <span class="kicker" data-i18n="portfolio_kicker"></span>
          <h2 data-i18n="portfolio_title"></h2>
          <p data-i18n="portfolio_sub"></p>
        </div>
        <div class="svc-bleed"><div class="works-grid" id="worksGrid"></div></div>
      </div>
    </section>

    <!-- Designs -->
    <section id="designs" style="display:none">
      <div class="container">
        <div class="sec-head reveal">
          <span class="kicker" data-i18n="designs_kicker"></span>
          <h2 data-i18n="designs_title"></h2>
          <p data-i18n="designs_sub"></p>
        </div>
        <div class="dg-bleed"><div class="dg-rows reveal" id="dgRows"></div></div>
        <div class="dg-project" id="dgProject" style="display:none"></div>
      </div>
    </section>

    <!-- About -->
    <section id="about">
      <div class="container about-grid">
        <div class="about-photo reveal"><img id="aboutImg" src="assets/img/about-workspace.jpg" alt="Workspace"></div>
        <div class="about-body reveal" data-delay="1">
          <span class="kicker" data-i18n="about_kicker"></span>
          <h2 class="sec-head h2" style="text-align:start;margin:0" data-i18n="about_title" id="aboutTitle"></h2>
          <p id="aboutText"></p>
          <ul class="about-points" id="aboutPoints"></ul>
        </div>
      </div>
    </section>

    <!-- Contact -->
    <section id="contact">
      <div class="container">
        <div class="sec-head reveal">
          <span class="kicker" data-i18n="contact_kicker"></span>
          <h2 data-i18n="contact_title"></h2>
          <p data-i18n="contact_sub"></p>
        </div>
        <div class="contact-grid">
          <div class="contact-info reveal">
            <h3 data-i18n="contact_info_title"></h3>
            <div id="contactChannels"></div>
            <div class="socials" id="socials"></div>
          </div>
          <form class="contact-form reveal" data-delay="1" id="contactForm">
            <h3 class="form-title" data-i18n="form_title"></h3>
            <div id="formFields"></div>
            <button class="btn btn-primary" type="submit">
              <span data-i18n="form_send"></span>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4z"/><path d="M22 2 11 13"/></svg>
            </button>
            <div class="form-status" id="formStatus"></div>
          </form>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <div class="container footer-wrap">
      <p>© <span id="year"></span> <span id="footerName"></span> — <span data-i18n="footer_rights"></span></p>
      <p id="footerExtra" style="display:none"></p>
      <div class="footer-links" id="footerSocials"></div>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/config.js?v=1795610272"></script>
  <script src="assets/js/content.js?v=1795610272"></script>
  <script src="assets/js/main.js?v=1795610272"></script>
</body>
</html>
